name: Run Tests
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    name: Run tests
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Install locales
        run: sudo apt-get install -y locales language-pack-it
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U --upgrade-strategy=eager --pre -e .[testsuite]
      - name: Start memcached
        uses: niden/actions-memcached@v7
      - name: Start Redis
        uses: supercharge/redis-github-action@1.4.0
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.8.0
      - uses: vishnudxb/redis-cluster@1.0.9
        with:
          master1-port: 5000
          master2-port: 5001
          master3-port: 5002
          slave1-port: 5003
          slave2-port: 5004
          slave3-port: 5005
          sleep-duration: 5
      - name: Test with pytest
        run: |
          pytest -vv
  docs:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: |
          python -m pip install -r beaker/docs/requirements.txt
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Build HTML and PDF with strict Sphinx warnings
        run: |
          sphinx-build -b html -W --keep-going beaker/docs build/docs/html
          sphinx-build -M latexpdf beaker/docs build/docs -W --keep-going
      - name: Check rendered PDF content
        run: |
          pdftotext -layout build/docs/latex/Beaker.pdf build/docs/Beaker.txt
          grep -F 'Beaker Documentation' build/docs/Beaker.txt
          grep -F 'CacheManager' build/docs/Beaker.txt
          grep -F 'RedisClusterNamespaceManager' build/docs/Beaker.txt
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            build/docs/html/
            build/docs/latex/Beaker.pdf
            build/docs/Beaker.txt
          if-no-files-found: error
      - name: Trigger Read the Docs rebuild
        if: github.event_name == 'push' && github.repository == 'bbangert/beaker' && github.ref == 'refs/heads/master'
        env:
          READTHEDOCS_WEBHOOK_SECRET: ${{ secrets.READTHEDOCS_WEBHOOK_SECRET }}
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          secret = os.environ["READTHEDOCS_WEBHOOK_SECRET"]
          if not secret:
              raise SystemExit("READTHEDOCS_WEBHOOK_SECRET is not configured")
          body = Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          request = Request(
              "https://app.readthedocs.org/api/v2/webhook/beaker/335255/",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "X-GitHub-Event": "push",
                  "X-Hub-Signature-256": f"sha256={signature}",
              },
          )
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
          if result.get("build_triggered") is not True:
              raise SystemExit("Read the Docs did not trigger a build")
          print("Read the Docs build triggered:", result.get("versions", []))
          PY
